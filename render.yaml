services:
  - type: web
    name: work-order-assistant
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: toodles-usage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_SHARED_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: DAILY_SPEND_CAP_USD
        value: "1.00"
      - key: USAGE_DB_PATH
        value: /var/data/toodles-usage.sqlite
      - key: OPENAI_INPUT_COST_PER_1M_TOKENS
        value: "1.25"
      - key: OPENAI_OUTPUT_COST_PER_1M_TOKENS
        value: "10.00"
      - key: USAGE_UNKNOWN_REQUEST_COST_USD
        value: "0.05"
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: MAX_SOURCE_CHARS
        value: "12000"
      - key: MAX_FIELD_NOTES_CHARS
        value: "12000"
      - key: MAX_OCR_CHARS
        value: "12000"
      - key: MAX_LABOR_CHARS
        value: "5000"
      - key: MAX_FOLLOW_UP_CHARS
        value: "5000"
